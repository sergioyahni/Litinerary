previews:
  generation: off

envVarGroups:
  - name: litinerary-provider-locks
    envVars:
      - key: ENABLE_REAL_LLM
        value: false
      - key: ENABLE_REAL_VECTOR_DB
        value: false
      - key: ENABLE_REAL_POI_PROVIDER
        value: false
      - key: ENABLE_REAL_ROUTING
        value: false
      - key: ENABLE_REAL_TICKETING
        value: false
      - key: ENABLE_REAL_TTS
        value: false
      - key: ENABLE_AFFILIATE_LINKS
        value: false
      - key: ENABLE_INTEGRATION_TESTS
        value: false
      - key: ENABLE_STAGED_INTERNAL_LLM_TESTING
        value: false
      - key: ENABLE_INTERNAL_ACCESS_GATE
        value: false
      - key: LITINERARY_AI_PROVIDER
        value: fake
      - key: LLM_PROVIDER
        value: fake
      - key: LITINERARY_VECTOR_PROVIDER
        value: fake
      - key: VECTOR_DB_PROVIDER
        value: fake
      - key: LITINERARY_POI_VERIFICATION_PROVIDER
        value: mock
      - key: POI_VERIFICATION_PROVIDER
        value: mock
      - key: POI_PROVIDER
        value: mock
      - key: ROUTING_PROVIDER
        value: mock
      - key: TICKETING_PROVIDER
        value: mock
      - key: AFFILIATE_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: PROVIDER_DAILY_COST_CEILING_USD
        value: 0
      - key: LLM_DAILY_LIVE_REQUEST_CEILING
        value: 0
      - key: LLM_DAILY_ESTIMATED_SPEND_CEILING_USD
        value: 0

databases:
  - name: litinerary-staging-postgres
    databaseName: litinerary_staging
    user: litinerary_staging
    postgresMajorVersion: "18"
  - name: litinerary-production-postgres
    databaseName: litinerary_production
    user: litinerary_production
    postgresMajorVersion: "18"

services:
  - type: web
    runtime: python
    name: litinerary-staging-backend
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - fromGroup: litinerary-provider-locks
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: false
      - key: ENABLE_ADMIN_ROUTES
        value: false
      - key: ENABLE_DEBUG_ROUTES
        value: false
      - key: ENABLE_MOCK_SERVICES
        value: true
      - key: ALLOW_EXTERNAL_CALLS
        value: true
      - key: EXTERNAL_CALL_ALLOWED_ENVIRONMENTS
        value: staging
      - key: ENABLE_AUTH
        value: true
      - key: AUTH_PROVIDER
        value: auth0
      - key: AUTH_REQUIRED_FOR_USER_FEATURES
        value: true
      - key: AUTH_ALLOW_DEV_USER_FALLBACK
        value: false
      - key: AUTH_JWT_ALGORITHMS
        value: RS256
      - key: AUTH_USER_ID_CLAIM
        value: sub
      - key: AUTH_ROLES_CLAIM
        value: roles
      - key: AUTH_SUBSCRIPTION_CLAIM
        value: subscription_status
      - key: AUTH_EMAIL_CLAIM
        value: email
      - key: AUTH_DISPLAY_NAME_CLAIM
        value: name
      - key: AUTH_JWT_ISSUER
        sync: false
      - key: AUTH_JWT_AUDIENCE
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: AUTH_PROVIDER_METADATA_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LITINERARY_DATABASE_URL
        fromDatabase:
          name: litinerary-staging-postgres
          property: connectionString
      - key: ENABLE_DURABLE_USAGE_CONTROLS
        value: true
      - key: ANONYMOUS_ITINERARY_GENERATIONS_PER_MINUTE
        value: 5
      - key: ANONYMOUS_ITINERARY_GENERATIONS_PER_DAY
        value: 50
      - key: REGISTERED_USER_ITINERARY_GENERATIONS_PER_MINUTE
        value: 15
      - key: REGISTERED_USER_ITINERARY_GENERATIONS_PER_DAY
        value: 100
      - key: SUBSCRIBER_CHAT_MESSAGES_PER_MINUTE
        value: 30
      - key: SUBSCRIBER_CHAT_MESSAGES_PER_DAY
        value: 100
      - key: PROVIDER_DAILY_REQUEST_CEILING
        value: 100
      - key: USAGE_COUNTER_RETENTION_DAYS
        value: 90

  - type: web
    runtime: static
    name: litinerary-staging-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ENABLE_AUTH
        value: true
      - key: VITE_AUTH_PROVIDER
        value: auth0
      - key: VITE_AUTH_ALLOW_DEV_LOGIN
        value: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
      - key: VITE_AUTH0_CALLBACK_URL
        sync: false
      - key: VITE_AUTH0_LOGOUT_RETURN_URL
        sync: false
      - key: VITE_AUTH0_USE_REFRESH_TOKENS
        value: false
      - key: VITE_AUTH0_CACHE_LOCATION
        value: memory

  - type: web
    runtime: python
    name: litinerary-production-backend
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - fromGroup: litinerary-provider-locks
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: ENABLE_ADMIN_ROUTES
        value: false
      - key: ENABLE_DEBUG_ROUTES
        value: false
      - key: ENABLE_MOCK_SERVICES
        value: false
      - key: ALLOW_EXTERNAL_CALLS
        value: true
      - key: EXTERNAL_CALL_ALLOWED_ENVIRONMENTS
        value: production
      - key: ENABLE_AUTH
        value: true
      - key: AUTH_PROVIDER
        value: auth0
      - key: AUTH_REQUIRED_FOR_USER_FEATURES
        value: true
      - key: AUTH_ALLOW_DEV_USER_FALLBACK
        value: false
      - key: AUTH_JWT_ALGORITHMS
        value: RS256
      - key: AUTH_USER_ID_CLAIM
        value: sub
      - key: AUTH_ROLES_CLAIM
        value: roles
      - key: AUTH_SUBSCRIPTION_CLAIM
        value: subscription_status
      - key: AUTH_EMAIL_CLAIM
        value: email
      - key: AUTH_DISPLAY_NAME_CLAIM
        value: name
      - key: AUTH_JWT_ISSUER
        sync: false
      - key: AUTH_JWT_AUDIENCE
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: AUTH_PROVIDER_METADATA_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LITINERARY_DATABASE_URL
        fromDatabase:
          name: litinerary-production-postgres
          property: connectionString
      - key: ENABLE_DURABLE_USAGE_CONTROLS
        value: true
      - key: ANONYMOUS_ITINERARY_GENERATIONS_PER_MINUTE
        value: 3
      - key: ANONYMOUS_ITINERARY_GENERATIONS_PER_DAY
        value: 20
      - key: REGISTERED_USER_ITINERARY_GENERATIONS_PER_MINUTE
        value: 10
      - key: REGISTERED_USER_ITINERARY_GENERATIONS_PER_DAY
        value: 50
      - key: SUBSCRIBER_CHAT_MESSAGES_PER_MINUTE
        value: 20
      - key: SUBSCRIBER_CHAT_MESSAGES_PER_DAY
        value: 100
      - key: PROVIDER_DAILY_REQUEST_CEILING
        value: 100
      - key: USAGE_COUNTER_RETENTION_DAYS
        value: 90

  - type: web
    runtime: static
    name: litinerary-production-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ENABLE_AUTH
        value: true
      - key: VITE_AUTH_PROVIDER
        value: auth0
      - key: VITE_AUTH_ALLOW_DEV_LOGIN
        value: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
      - key: VITE_AUTH0_CALLBACK_URL
        sync: false
      - key: VITE_AUTH0_LOGOUT_RETURN_URL
        sync: false
      - key: VITE_AUTH0_USE_REFRESH_TOKENS
        value: false
      - key: VITE_AUTH0_CACHE_LOCATION
        value: memory
