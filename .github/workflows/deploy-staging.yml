name: Deploy Staging

"on":
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Staging migration, deploy, smoke
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      LITINERARY_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      RENDER_STAGING_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_BACKEND_DEPLOY_HOOK_URL }}
      RENDER_STAGING_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_FRONTEND_DEPLOY_HOOK_URL }}
      STAGING_BACKEND_BASE_URL: ${{ vars.STAGING_BACKEND_BASE_URL }}
      STAGING_FRONTEND_BASE_URL: ${{ vars.STAGING_FRONTEND_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Resolve release SHA
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            release_sha="${{ github.event.workflow_run.head_sha }}"
          else
            release_sha="${{ github.sha }}"
          fi
          case "$release_sha" in
            [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]*)
              echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Invalid release SHA" >&2
              exit 1
              ;;
          esac
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Verify staging activation inputs
        run: |
          test -n "$LITINERARY_DATABASE_URL"
          test -n "$RENDER_STAGING_BACKEND_DEPLOY_HOOK_URL"
          test -n "$RENDER_STAGING_FRONTEND_DEPLOY_HOOK_URL"
          test -n "$STAGING_BACKEND_BASE_URL"
          test -n "$STAGING_FRONTEND_BASE_URL"
          test -n "$RELEASE_SHA"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-ci.txt -c backend/constraints-runtime.txt
      - name: Run staging migration
        working-directory: backend
        env:
          APP_ENV: staging
        run: python -m alembic upgrade head
      - name: Verify staging migration head
        working-directory: backend
        env:
          APP_ENV: staging
        run: python -m alembic current
      - name: Seed staging reference data
        working-directory: backend
        env:
          APP_ENV: staging
        run: python -m scripts.seed_database
      - name: Trigger Render staging backend deploy
        run: >
          python scripts/ci/render_deploy.py
          --hook-url "$RENDER_STAGING_BACKEND_DEPLOY_HOOK_URL"
          --ref "$RELEASE_SHA"
          --label staging-backend
      - name: Trigger Render staging frontend deploy
        run: >
          python scripts/ci/render_deploy.py
          --hook-url "$RENDER_STAGING_FRONTEND_DEPLOY_HOOK_URL"
          --ref "$RELEASE_SHA"
          --label staging-frontend
      - name: Staging release verification and public smoke
        run: >
          python scripts/ci/post_deploy_smoke.py
          --base-url "$STAGING_BACKEND_BASE_URL"
          --frontend-url "$STAGING_FRONTEND_BASE_URL"
          --expected-release-sha "$RELEASE_SHA"
          --wait-for-release
          --require-ready
