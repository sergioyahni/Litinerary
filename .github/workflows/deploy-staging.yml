name: Deploy Staging

"on":
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Staging migration, deploy, smoke
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      LITINERARY_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
      STAGING_BACKEND_BASE_URL: ${{ vars.STAGING_BACKEND_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Verify staging activation inputs
        run: |
          test -n "$LITINERARY_DATABASE_URL"
          test -n "$RENDER_DEPLOY_HOOK_URL"
          test -n "$STAGING_BACKEND_BASE_URL"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run staging migration
        working-directory: backend
        env:
          APP_ENV: staging
        run: python -m alembic upgrade head
      - name: Verify staging migration head
        working-directory: backend
        env:
          APP_ENV: staging
        run: python -m alembic current
      - name: Trigger Render staging deploy
        run: curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Staging health, readiness, and public smoke
        run: python scripts/ci/post_deploy_smoke.py --base-url "$STAGING_BACKEND_BASE_URL" --require-ready
