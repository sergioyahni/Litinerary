name: Deploy Production

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production-approval-deploy:
    name: Production migration, deploy, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      LITINERARY_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
      PRODUCTION_BACKEND_BASE_URL: ${{ vars.PRODUCTION_BACKEND_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Verify production activation inputs
        run: |
          test -n "$LITINERARY_DATABASE_URL"
          test -n "$RENDER_DEPLOY_HOOK_URL"
          test -n "$PRODUCTION_BACKEND_BASE_URL"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run production migration
        working-directory: backend
        env:
          APP_ENV: production
        run: python -m alembic upgrade head
      - name: Verify production migration head
        working-directory: backend
        env:
          APP_ENV: production
        run: python -m alembic current
      - name: Trigger Render production deploy
        run: curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Production health, readiness, and public smoke
        run: python scripts/ci/post_deploy_smoke.py --base-url "$PRODUCTION_BACKEND_BASE_URL" --require-ready
